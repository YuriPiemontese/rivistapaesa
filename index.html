<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rivista Paesà</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Old+Standard+TT:ital,wght@0,700;1,400&display=swap" rel="stylesheet">

  <!-- CSS Principale -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Componente Header -->
  <header id="site-header"></header>

  <main>
    <!-- Sezione Hero Banner Homepage -->
    <section class="hero-banner">
      <img src="banner/banner1a.jpg" alt="Banner Rivista Paesà">
    </section>

    <!-- Contenuto principale Homepage -->
    <section style="max-width: 1200px; margin: 60px auto; padding: 0 20px;">
      <h1>Rivista Paesà</h1>
      <p style="margin-top: 20px;">Benvenuti su Rivista Paesà.</p>
    </section>
  </main>

  <!-- Componente Footer -->
  <footer id="site-footer"></footer>

  <!-- Script Caricamento Moduli Header / Footer -->
  <script>
    function loadComponent(id, file) {
      fetch(file)
        .then(res => res.text())
        .then(data => {
          document.getElementById(id).innerHTML = data;
        })
        .catch(err => console.error('Errore caricamento componente:', err));
    }

    loadComponent('site-header', 'components/header.html');
    loadComponent('site-footer', 'components/footer.html');
  </script>

</body>
</html>
