<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paz in provincia - Rivista Paesà</title>

  <!-- Google Fonts completi come in Homepage -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=Special+Elite&display=swap" rel="stylesheet">

  <style>
    /* ==========================================
       1. Font Personalizzati (Percorsi aggiornati con ../)
       ========================================== */
    @font-face {
      font-family: "Archive Garamond Pro";
      src: url("../fonts/ArchiveGaramondPro-Regular.woff2") format("woff2"),
           url("../fonts/ArchiveGaramondPro-Regular.ttf") format("truetype");
      font-weight: normal;
      font-style: normal;
    }

    @font-face {
      font-family: "TrixiePro";
      src: url("../fonts/TrixiePro-Heavy.woff2") format("woff2"),
           url("../fonts/TrixiePro-Heavy.ttf") format("truetype");
      font-weight: 900;
      font-style: normal;
    }

    /* ==========================================
       2. Stili Generali e Font
       ========================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f7f3eb;
      color: #464228;
      font-family: "Archive Garamond Pro", "EB Garamond", Georgia, serif;
      font-size: 1.2rem;
      line-height: 1.8;
      overflow-x: hidden;
    }

    h1, h2, h3 {
      font-family: "Old Standard TT", serif;
      font-weight: 700;
      color: #464228;
      text-transform: uppercase;
      letter-spacing: -0.02em;
    }

    .caption, figcaption, .meta-articolo, .typewriter {
      font-family: "TrixiePro", "Special Elite", monospace;
    }

    /* ==========================================
       3. Header (Homepage Layout & Fonts)
       ========================================== */
    header {
      width: 100%;
      height: 110px;
      padding: 0 40px;
      display: flex;
      align-items: center;
    }

    .header-container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Navigazione (Sinistra) */
    .header-nav {
      flex: 1;
      display: flex;
      justify-content: flex-start;
    }

    .header-nav ul {
      display: flex;
      list-style: none;
      gap: 25px;
    }

    .header-nav a {
      text-decoration: none;
      color: #464228;
      font-family: "TrixiePro", "Cinzel", serif;
      font-weight: 900;
      font-size: 0.95rem;
      text-transform: capitalize;
      transition: opacity 0.2s ease;
    }

    .header-nav a:hover {
      opacity: 0.6;
    }

    /* Logo (Centro) */
    .header-logo {
      flex: 1;
      display: flex;
      justify-content: center;
    }

    .header-logo a {
      text-decoration: none;
      color: #464228;
      font-family: "Cinzel", serif;
      font-weight: 700;
      font-size: 1.8rem;
      letter-spacing: 0.1em;
    }

    .header-logo img {
      max-height: 60px;
      width: auto;
      display: block;
    }

    /* Social/Azioni (Destra) */
    .header-social {
      flex: 1;
      display: flex;
      justify-content: flex-end;
    }

    .btn-instagram-header {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #464228;
      text-decoration: none;
      font-family: "TrixiePro", "Special Elite", monospace;
      font-weight: 900;
      font-size: 0.95rem;
      transition: opacity 0.2s ease;
    }

    .btn-instagram-header:hover {
      opacity: 0.6;
    }

    .btn-instagram-header svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    /* ==========================================
       4. Banner Principale
       ========================================== */
    .hero-banner-section {
      width: 100%;
      padding: 0 40px;
      margin-top: 10px;
    }

    .hero-banner-container {
      max-width: 1200px;
      margin: 0 auto;
      overflow: hidden;
    }

    .hero-banner-container img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
    }

    /* ==========================================
       5. Struttura Articolo
       ========================================== */
    article.articolo-container {
      max-width: 800px;
      margin: 40px auto 100px auto;
      padding: 0 20px;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 30px;
      color: #464228;
      text-decoration: none;
      font-size: 0.95rem;
      transition: opacity 0.2s ease;
    }

    .back-link:hover {
      opacity: 0.6;
    }

    .articolo-header {
      margin-bottom: 40px;
    }

    .articolo-header h1 {
      font-size: 2.8rem;
      line-height: 1.2;
      margin-bottom: 15px;
    }

    .meta-articolo {
      font-size: 0.9rem;
      text-transform: uppercase;
      color: #6e6843;
      margin-bottom: 25px;
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }

    .copertina-articolo {
      width: 100%;
      margin-bottom: 40px;
    }

    .copertina-articolo img {
      width: 100%;
      max-height: 500px;
      object-fit: cover;
      display: block;
    }

    .copertina-articolo figcaption {
      font-size: 0.85rem;
      margin-top: 8px;
      color: #6e6843;
    }

    /* Contenuto Testuale in Garamond */
    .articolo-corpo p {
      margin-bottom: 25px;
      text-align: justify;
    }

    /* Citazioni nel font TrixiePro */
    .articolo-corpo blockquote {
      margin: 35px 0;
      padding: 20px 25px;
      border-left: 3px solid #464228;
      background-color: rgba(70, 66, 40, 0.05);
      font-family: "TrixiePro", monospace, sans-serif;
      font-weight: 900;
      font-size: 0.95rem;
      line-height: 1.6;
    }

    .articolo-corpo blockquote p {
      margin-bottom: 0;
      text-align: left;
    }

    .citazione-trixie {
      margin: 35px 0;
      padding: 25px 30px;
      border-top: 1px solid #464228;
      border-bottom: 1px solid #464228;
      font-family: "TrixiePro", monospace, sans-serif;
      font-weight: 900;
      font-size: 0.95rem;
      line-height: 1.8;
    }

    .citazione-trixie p {
      margin-bottom: 0;
      text-align: left;
    }

    /* ==========================================
       6. Footer
       ========================================== */
    footer {
      width: 100%;
      background-color: #464228;
      color: #f7f3eb;
      padding: 50px 40px;
    }

    .footer-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .footer-logo img {
      max-height: 45px;
      width: auto;
      display: block;
      filter: brightness(0) invert(1);
    }

    .btn-instagram-footer {
      display: inline-block;
      font-family: "TrixiePro", monospace, sans-serif;
      font-weight: 900;
      color: #f7f3eb;
      text-decoration: none;
      font-size: 1.05rem;
      border: 1px solid #f7f3eb;
      padding: 8px 16px;
      transition: background-color 0.2s ease, opacity 0.2s ease;
    }

    .btn-instagram-footer:hover {
      background-color: rgba(247, 243, 235, 0.15);
      opacity: 0.9;
    }

    /* Media Query Mobile */
    @media (max-width: 900px) {
      header {
        height: auto;
        padding: 20px;
      }
      .header-container {
        flex-direction: column;
        gap: 20px;
      }
      .header-nav, .header-logo, .header-social {
        justify-content: center;
        width: 100%;
      }
      .header-logo {
        order: -1;
      }
      .hero-banner-section, footer {
        padding-left: 20px;
        padding-right: 20px;
      }
      .articolo-header h1 { font-size: 2.1rem; }
      .footer-container {
        flex-direction: column;
        gap: 20px;
        align-items: center;
      }
    }
  </style>
</head>
<body>

        </ul>

      <div class="header-logo">

          <span style="display:none;">PAESÀ</span>
        </a>
      </div>

      <div class="header-social">
